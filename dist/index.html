<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom Literatury w Łodzi</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

    <style>
        /* Kamera – wypełnia cały ekran i znajduje się pod sceną 3D */
        #webcam {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        body,
        html {
            margin: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            background-color: transparent;
        }

        /* Instrukcja dla użytkownika */
        #instrukcja {
            position: fixed;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;

            width: calc(100% - 40px);
            max-width: 600px;

            box-sizing: border-box;
            padding: 14px 20px;

            background: rgba(0, 0, 0, 0.65);
            color: white;

            font-family: Arial, sans-serif;
            font-size: 18px;
            font-weight: bold;
            line-height: 1.4;
            text-align: center;

            border-radius: 14px;

            /* Tekst nie blokuje sterowania sceną */
            pointer-events: none;
        }
    </style>
</head>

<body>

    <!-- Obraz z kamery -->
    <video id="webcam" autoplay playsinline></video>

    <!-- Instrukcja -->
    <div id="instrukcja">
        🔎 Rozejrzyj się dookoła!<br>
        Spójrz również w górę i w dół, aby znaleźć płotkę.
    </div>

    <!-- Scena A-Frame -->
    <a-scene
        webxr="requiredFeatures: local-floor;"
        style="background: transparent;"
    >

        <a-assets>
            <a-asset-item
                id="model-rzeźby"
                src="https://cdn.tinyglb.com/models/6ef2003d31bf4a628b14565e635115d0.glb">
            </a-asset-item>
        </a-assets>

        <!-- Oświetlenie -->
        <a-light
            type="ambient"
            color="#FFFFFF"
            intensity="1.8">
        </a-light>

        <a-light
            type="directional"
            color="#FFFFFF"
            intensity="5"
            position="-2 4 3">
        </a-light>

        <!-- Model płotki -->
        <a-gltf-model
            id="rzezba"
            src="#model-rzeźby"
            shadow>
        </a-gltf-model>

        <!-- Kamera -->
        <a-entity
            camera
            look-controls
            position="0 1.6 0">
        </a-entity>

    </a-scene>

    <script>
        // =========================================================
        // URUCHOMIENIE KAMERY TELEFONU
        // =========================================================

        const video = document.getElementById('webcam');

        if (
            navigator.mediaDevices &&
            navigator.mediaDevices.getUserMedia
        ) {
            navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: "environment"
                }
            })
            .then(function(stream) {
                video.srcObject = stream;
            })
            .catch(function(error) {
                console.error(
                    "Błąd dostępu do kamery:",
                    error
                );
            });
        }


        // =========================================================
        // LOSOWANIE LICZBY Z PRZEDZIAŁU
        // =========================================================

        function losujPrzedzial(min, max) {
            return Math.random() * (max - min) + min;
        }


        // =========================================================
        // LOSOWANIE POZYCJI PŁOTKI
        // =========================================================

        document
            .querySelector('a-scene')
            .addEventListener('loaded', function () {

                const rzezba =
                    document.getElementById('rzezba');

                // Losowanie pozycji X, Y oraz Z
                const x = losujPrzedzial(-5, 5);
                const y = losujPrzedzial(-3, 5);
                const z = losujPrzedzial(-5, 5);

                // Ustawienie pozycji modelu
                rzezba.setAttribute(
                    'position',
                    `${x} ${y} ${z}`
                );


                // =================================================
                // SPRAWDZENIE WYSOKOŚCI MODELU
                // =================================================

                // Jeśli model znajduje się powyżej
                // wysokości oczu użytkownika (1.6 m)
                if (y > 1.6) {

                    // Obracamy płotkę do góry nogami
                    rzezba.setAttribute(
                        'rotation',
                        '0 0 180'
                    );

                    console.log(
                        `[SUFIT] Model nad widzem ` +
                        `(Y: ${y.toFixed(2)}m) ` +
                        `- obrócono do góry nogami!`
                    );

                } else {

                    // Standardowa orientacja
                    rzezba.setAttribute(
                        'rotation',
                        '0 0 0'
                    );

                    console.log(
                        `[ZPOZYCJONOWANO] ` +
                        `Model na standardowej wysokości ` +
                        `(Y: ${y.toFixed(2)}m)`
                    );
                }
            });
    </script>

</body>
</html>
